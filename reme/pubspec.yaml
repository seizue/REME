name: reme
description: REME - Recipe & Business Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  provider: ^6.1.1
  intl: ^0.20.2
  uuid: ^4.3.3
  google_fonts: ^8.0.2
  fl_chart: ^1.2.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.5
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#7E5537"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  image: assets/icon/app_icon.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#000000"
    image: assets/icon/app_icon.png
    icon_background_color: "#7E5537"
    icon_background_color_dark: "#000000"
